
[project]
name = "oneliner"
version = "0.4.0"
description = "Command-line tool for keeping single-line notes"
readme = "readme.md"
license = { text = "MIT" }
requires-python = ">=3.12"
authors = [
    { name = "Marcus Kazmierczak", email = "marcus@mkaz.com" },
]
keywords = ["notes", "journal", "cli"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]
dependencies = [
    "appdirs>=1.4",
    "toml>=0.10",
]

[project.optional-dependencies]
dev = [
    "mypy>=1.10",
    "pytest>=8.2",
    "ruff>=0.4",
]

[project.scripts]
oneliner = "oneliner.oneliner:main"

[project.urls]
Homepage = "https://github.com/mkaz/oneliner"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["oneliner"]


[tool.pytest.ini_options]
minversion = "7.0"
addopts = "-ra"
pythonpath = "oneliner"
testpaths = [
    "tests",
]

[tool.ruff]
target-version = "py312"

[tool.ruff.format]
preview = true

[tool.mypy]

[[tool.mypy.overrides]]
module = [
    "toml",
]
ignore_missing_imports = true
